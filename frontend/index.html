<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>트래블핀 — 핀을 던지고 떠나요</title>
<meta name="description" content="지도에 핀을 던져 랜덤으로 국내 여행지를 뽑아주는 서비스.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span>트래블핀</div>
  <div class="counter" id="counterText">전국 데이터 불러오는 중…</div>
</header>

<main>
  <section class="panel-left">
    <p class="tagline">어디로 갈지 고민하지 말고,<br>핀을 던지세요.</p>

    <div class="field">
      <label for="originInput">현재 지역</label>
      <input type="text" id="originInput" list="originList" placeholder="예: 서울 마포구" autocomplete="off">
      <datalist id="originList"></datalist>
    </div>

    <div class="field">
      <div class="field-row"><span class="label">최대 이동 거리</span><span class="val" id="distVal">150km</span></div>
      <input type="range" id="distRange" min="50" max="400" step="50" value="150">
      <div class="range-scale"><span>50km</span><span>400km</span></div>
    </div>

    <div class="toggle-row">
      <span class="label">섬 추가</span>
      <div class="toggle-control">
        <div class="switch" id="islandToggle" role="switch" aria-checked="false" tabindex="0"><div class="knob"></div></div>
        <span class="switch-text" id="islandToggleText">OFF</span>
      </div>
    </div>

    <button class="btn-primary" id="throwBtn">핀 던지기</button>
    <p class="hint" id="originHint">지역을 입력하면 그 지역 기준으로 거리 안에서 뽑아요. 비워두면 전국에서 뽑아요.</p>
  </section>

  <section class="panel-right">
    <div class="eyebrow">뽑힌 여행지</div>

    <div class="empty-state" id="emptyState">
      <div class="icon">📍</div>
      <p>아직 뽑지 않았어요.<br>왼쪽에서 핀을 던져보세요.</p>
    </div>

    <div class="result-body" id="resultBody">
      <div>
        <h2 class="result-name" id="resultName">-</h2>
        <div class="result-meta">
          <span id="metaDistance"></span>
          <span id="metaTime"></span>
        </div>
        <div class="actions">
          <button id="btnRetry">다시 뽑기</button>
          <button id="btnMap">지도에서 보기</button>
          <button id="btnShare">공유하기</button>
        </div>
      </div>
      <div class="map-wrap">
        <svg viewBox="0 0 200 300" id="mapSvg" aria-hidden="true">
          <path d="M70 8 L96 4 L112 18 L108 34 L120 40 L134 52 L150 60 L158 78 L150 92 L156 108 L148 122 L152 138 L140 150 L142 168 L128 180 L132 196 L118 210 L110 228 L96 236 L90 254 L74 262 L64 250 L56 260 L46 246 L52 228 L44 214 L52 198 L44 182 L52 166 L46 150 L54 134 L48 116 L58 100 L52 82 L62 66 L56 48 L66 32 L60 16 Z"
                fill="none" stroke="#3a3d55" stroke-width="1.5" stroke-linejoin="round"/>
          <line id="dashLine" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
          <circle id="originDot" cx="0" cy="0" r="3.5" fill="#565a78" opacity="0"/>
          <circle id="resultDot" cx="0" cy="0" r="6" fill="var(--accent)" opacity="0"/>
          <line id="resultPin" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent)" stroke-width="1.5" opacity="0"/>
        </svg>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
